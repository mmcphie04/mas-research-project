# Tier 1: a real (tiny, ungated) model on CPU. Validates prompt rendering, readout token
# indexing, letter logits and activation shapes -- not science.
# Gemma is gated: accept the licence on the model page, then `huggingface-cli login`.
# Ungated fallback if that is not done: HuggingFaceTB/SmolLM2-135M-Instruct
run_id: smoke-tiny
model:
  backend: hf
  repo_id: google/gemma-3-270m-it
  device: cpu
  dtype: float32
  max_new_tokens: 96
  temperature: 0.7
  batch_size: 4
data:
  dataset: synthetic
  n_questions: 4
activations:
  shard_size: 64
