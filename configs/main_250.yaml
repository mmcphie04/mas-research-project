# Longer-response protocol (docs/NEXT_PHASE_PLAN.md, 2026-10-29 evening). Layer over
# configs/base.yaml + configs/colab_12b.yaml. Versioned: debate.brevity_words=250 selects the
# "about 250 words" template (prompts.BREVITY_250); the legacy 150-word archives are untouched and
# never pooled with these samples.
#   pool of 10 independent first answers per question (agents 0..9; panels 0-2 and 0-4 nested)
#   max_new_tokens 1280 (proportional to 768 for 150 words); an allowance, not a minimum
# Readouts at batch size 1: G1 (docs/NEXT_PHASE_CPU_RESULTS.md s16) showed batched readouts are
# batch-composition dependent for sensitive inputs (up to 0.5 in probability) while single-item
# reads are bit-for-bit reproducible. Generation stays batched. (A 5-agent round-1 readout can
# reach ~8.3k tokens and a round-2 readout ~14k, each holding every layer's states.)
debate:
  n_agents: 10
  brevity_words: 250
model:
  # stored forced-choice distributions from the fp32 projection of the final hidden state
  # (docs/NEXT_PHASE_CPU_RESULTS.md s11); versioned, so legacy identities are unchanged
  readout_head: fp32_head
  max_new_tokens: 1280
  batch_size: 8
  readout_batch_size: 1
