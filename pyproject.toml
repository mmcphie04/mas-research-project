[project]
name = "mad-probes"
version = "0.1.0"
description = "Internal representations for evaluating answer revisions in multi-agent debate"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["datasets>=2.20"]
hf = ["torch>=2.4", "transformers>=4.44", "accelerate>=0.33"]
gpu = ["vllm>=0.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mad = "mad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# The dev laptop has no CUDA; pull the CPU-only torch wheel (~200 MB instead of ~2.5 GB).
# On a GPU box, install the `gpu` extra from the default index instead.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "platform_system == 'Linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
